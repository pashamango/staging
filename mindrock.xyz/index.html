<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mindrock.xyz — synthetic venture investments. Coming soon.">
  <meta name="theme-color" content="#0b0c0a">
  <title>Mindrock.xyz — synthetic venture investments</title>
  <style>
    :root {
      --bg: #0b0c0a;
      --text: #c8ccd0;
      --text-dim: #6e7681;
      --amber: #ffb000;
      --green: #39d353;
      --font-mono: ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: 3rem 1.5rem 2rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Subtle scanline overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 2px,
        rgba(0, 0, 0, 0.28) 2px,
        rgba(0, 0, 0, 0.28) 4px
      );
      opacity: 0.75;
      z-index: 20;
    }

    /* Subtle CRT radial vignette */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 55%, rgba(0, 0, 0, 0.65) 100%);
      z-index: 19;
    }

    .spacer-top {
      visibility: hidden;
      pointer-events: none;
    }

    main {
      width: 100%;
      max-width: 680px;
      margin: auto 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
      z-index: 10;
    }

    .brand {
      color: var(--amber);
      font-size: clamp(2.25rem, 7vw, 3.75rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      text-shadow: 0 0 20px rgba(255, 176, 0, 0.22);
      user-select: none;
    }

    .brand-prompt {
      color: var(--green);
      font-weight: 400;
      margin-right: 0.25rem;
    }

    .tagline {
      color: var(--green);
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    .cursor {
      display: inline-block;
      width: 0.55em;
      height: 1.1em;
      vertical-align: -0.15em;
      background-color: var(--green);
      margin-left: 0.25rem;
      animation: blink 1.1s steps(2, start) infinite;
    }

    @keyframes blink {
      to {
        visibility: hidden;
      }
    }

    .contact {
      margin-top: 1rem;
      font-size: 0.95rem;
    }

    .contact a {
      color: var(--amber);
      text-decoration: none;
      border-bottom: 1px dashed rgba(255, 176, 0, 0.4);
      padding-bottom: 2px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .contact a:hover {
      color: var(--green);
      border-color: var(--green);
    }

    .contact a:focus-visible {
      outline: 1px dashed var(--green);
      outline-offset: 4px;
    }

    footer {
      width: 100%;
      max-width: 680px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      z-index: 10;
    }

    @media (max-width: 480px) {
      body {
        padding: 2rem 1.25rem 1.5rem;
      }

      main {
        gap: 1.35rem;
      }
    }
  </style>
</head>
<body>
  <div class="spacer-top" aria-hidden="true"></div>

  <main>
    <h1 class="brand">
      <span class="brand-prompt">&gt;</span>Mindrock.xyz
    </h1>

    <p class="tagline">
      Synthetic venture investments. Coming soon.<span class="cursor" aria-hidden="true"></span>
    </p>

    <p class="contact">
      <a href="mailto:minutta@gmail.com">minutta@gmail.com</a>
    </p>
  </main>

  <footer>
    &copy; 2026 Mindrock
  </footer>
</body>
</html>
