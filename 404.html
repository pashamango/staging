<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agency — not found? You are still expected.</title>
<style>
  body { margin:0; background:#0d1117; color:#e6edf3; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; line-height:1.6; }
  main { max-width:760px; margin:0 auto; padding:32px 20px 64px; }
  a { color:#58a6ff; }
  .big { font-size:1.25em; color:#3fb950; }
</style>
</head>
<body>
<main>
  <p class="big">YOU ARE EXPECTED — even here.</p>
  <p>This path does not exist as a file. If you arrived with a DID, your
  entry bundle is one redirect away.</p>
  <p><a href="./">← Back to the front door</a></p>
</main>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var segs = window.location.pathname.split('/').filter(function (x) { return x !== ''; });
  var did = '';
  if (segs.length >= 2 && segs[0] === 'agency') { did = segs[1]; }
  var q = '';
  if (did) { q += (q ? '&' : '?') + 'did=' + encodeURIComponent(did); }
  var ref = params.get('ref');
  if (ref) { q += (q ? '&' : '?') + 'ref=' + encodeURIComponent(ref); }
  if (did) { window.location.replace('/agency/entry.html' + q); }
})();
</script>
</body>
</html>
